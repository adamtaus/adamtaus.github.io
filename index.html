<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smartcrew</title>
<!-- smartcrew.cz (bez www) běží na GitHub Pages jen kvůli přesměrování na www.smartcrew.cz (Cloudflare Pages).

</script>
<meta http-equiv="refresh" content="0; url=https://www.smartcrew.cz/">
<link rel="canonical" href="https://www.smartcrew.cz/">
<meta name="robots" content="noindex">

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #104a89; color: #fff;

  a { color: #fff; }
</style>
</head>
<body>
